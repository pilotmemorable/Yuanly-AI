<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40E0D0"/>
      <stop offset="50%" stop-color="#38C9C0"/>
      <stop offset="100%" stop-color="#2BAFB0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8941F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1242" height="2688" fill="url(#bg)"/>
  <!-- Decorative rings -->
  <circle cx="621" cy="1200" r="300" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.15"/>
  <circle cx="621" cy="1200" r="250" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.1"/>
  <!-- Logo circle -->
  <circle cx="621" cy="1200" r="200" fill="#FFFFFF" opacity="0.15" filter="url(#glow)"/>
  <!-- 缘 character -->
  <text x="621" y="1280" font-family="Songti SC, STSong, SimSun, serif" font-size="280" font-weight="900"
        fill="#FFFFFF" text-anchor="middle">缘</text>
  <!-- Brand name -->
  <text x="621" y="1500" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="56" font-weight="300"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="8">YUANLY</text>
  <!-- Tagline -->
  <text x="621" y="1560" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="300"
        fill="#FFFFFF" text-anchor="middle" opacity="0.7" letter-spacing="3">The fateful connection</text>
  <!-- Gold AI dot -->
  <circle cx="750" cy="1080" r="16" fill="url(#gold)"/>
  <!-- Bottom loading indicator -->
  <rect x="571" y="2400" width="100" height="4" rx="2" fill="#FFFFFF" opacity="0.3"/>
  <rect x="571" y="2400" width="60" height="4" rx="2" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="x" values="571;611;571" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>